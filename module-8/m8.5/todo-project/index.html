<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center pt-16">

  <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-md h-fit">
    <h1 class="text-2xl font-bold text-slate-800 mb-4">My To-Do List</h1>

    <!-- Form to add a new task -->
    <form id="task-form" class="flex gap-2 mb-4">
      <input id="task-input" type="text" placeholder="Add a new task..."
        class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">Add</button>
    </form>

    <!-- Filter buttons -->
    <div class="flex gap-2 mb-4">
      <button class="filter-btn px-3 py-1 rounded-lg text-sm" data-filter="all">All</button>
      <button class="filter-btn px-3 py-1 rounded-lg text-sm" data-filter="active">Active</button>
      <button class="filter-btn px-3 py-1 rounded-lg text-sm" data-filter="completed">Completed</button>
    </div>

    <!-- Tasks will be rendered here by JavaScript -->
    <ul id="task-list" class="space-y-2"></ul>

    <!-- Shown when there are no tasks -->
    <p id="empty-msg" class="text-center text-slate-400 py-6 hidden">No tasks here</p>

    <!-- Count of remaining tasks -->
    <p id="task-count" class="text-sm text-slate-500 mt-4"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
